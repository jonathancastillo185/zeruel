[package]
name = "zeruel-cli"
description = "Binario de zeruel: CLI y pipeline de ejemplo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zeruel-sdk = { path = "../zeruel-sdk" }
zeruel-core = { path = "../zeruel-core", features = ["sql", "wasm"] }
zeruel-data = { path = "../zeruel-data" }
zeruel = { path = "../zeruel" }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }
polars = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
sysinfo = { workspace = true }
ctrlc = { workspace = true }
tiny_http = { workspace = true }

[[bin]]
name = "zeruel"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

# Solo Windows: integracion con el Administrador de servicios (SCM). Sin esto
# `zeruel serve` es una app de consola y el SCM la da por colgada, porque nunca
# reporta estado. Necesita un envoltorio tipo NSSM, que es una pieza mas que
# instalar y mantener.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
