[package]
name = "zeruel-data"
description = "Tareas de datos de zeruel: Parquet, Polars, SQL"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zeruel-sdk = { path = "../zeruel-sdk" }
zeruel-core = { path = "../zeruel-core", default-features = false }
anyhow = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
polars = { workspace = true }
chrono = { workspace = true }
[features]
default = []
# Leer y escribir Parquet/CSV directo contra almacenamiento de objetos
# (s3://, az://, gs://) con el streaming nativo de polars.
cloud = ["polars/cloud", "polars/aws", "polars/azure", "polars/gcp"]

[dev-dependencies]
tempfile = "3"
uuid = { workspace = true }
